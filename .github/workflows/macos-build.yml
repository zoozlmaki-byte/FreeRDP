name: macos-build

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    name: FreeRDP macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew install autoconf automake libtool meson cmake ninja pkg-config

      - name: Build FreeRDP
        run: |
          ./scripts/bundle-mac-os.sh -a ${{ matrix.arch }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: freerdp-macos-${{ matrix.arch }}
          path: install/
          if-no-files-found: error
